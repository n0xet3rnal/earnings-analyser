[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#8B5CF6"
backgroundColor = "#06060A"
secondaryBackgroundColor = "#0F0D16"
textColor = "#EDEAF6"
font = "Libre Baskerville:https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap, serif"
headingFont = "Libre Baskerville:https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap, serif"
headingFontWeights = 700
baseRadius = "1rem"
buttonRadius = "full"
borderColor = "#211C2E"
showWidgetBorder = true
