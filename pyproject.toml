[project]
name = "earnings-analyser"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "dspy>=2.6.0",
    "litellm>=1.60.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
calibration = ["datasets>=2.20.0", "huggingface-hub>=0.24.0", "pandas>=2.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
